<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xml:lang="en" lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="keywords" content="DnD, dungeons and dragons, roleplay, dice, roller, 3D, RPG, physics engine" />
    <meta name="description" content="Modular 3D Dice Game Engine Demo" />
    <title>Modular 3D Dice Engine - Multi-Mode Playground</title>

    <style type="text/css">
        @import "../main.css";
    </style>
    <style type="text/css">
        @import "dice.css";
    </style>
    <style type="text/css">
        @import "../src/presentation/ResultPresenter.css";
    </style>

    <style type="text/css">
        /* Multi-mode HUD toolbar */
        #demo-toolbar {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: rgba(18, 22, 28, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 8px 40px 8px 18px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        #demo-toolbar select,
        #demo-toolbar input,
        #demo-toolbar button {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        #demo-toolbar select:focus,
        #demo-toolbar input:focus {
            border-color: #64b5f6;
            background: rgba(255, 255, 255, 0.18);
        }

        #demo-toolbar button {
            cursor: pointer;
            font-weight: 600;
            background: #2563eb;
            border: 1px solid #3b82f6;
        }

        #demo-toolbar button:hover {
            background: #1d4ed8;
        }

        #demo-toolbar button#btn-clear {
            background: rgba(239, 68, 68, 0.8);
            border-color: rgba(239, 68, 68, 1);
        }

        #demo-toolbar button#btn-clear:hover {
            background: rgba(220, 38, 38, 1);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Hidable engine options panel */
        #demo-toolbar[hidden] {
            display: none;
        }

        #engine-panel-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: rgba(18, 22, 28, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        #engine-panel-toggle:hover {
            background: rgba(37, 99, 235, 0.9);
            transform: scale(1.05);
        }

        #engine-panel-toggle[hidden] {
            display: none;
        }

        #demo-toolbar button#btn-hide-panel {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 50%;
            color: rgba(255, 255, 255, 0.75);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            box-shadow: none;
        }

        #demo-toolbar button#btn-hide-panel:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

    </style>

    <script src="../libs/three.min.js"></script>
    <script src="../libs/cannon.min.js"></script>

    <script type="module">
        import { dice_initialize } from './main.js';

        window.engineApp = dice_initialize(document.body);
    </script>
</head>

<body style="margin: 0; overflow: hidden; background-color: #0b0f19;">

    <!-- Toggle for the hidable engine options panel -->
    <button id="engine-panel-toggle" type="button" title="Show engine options"
        aria-label="Show engine options" aria-controls="demo-toolbar" aria-expanded="false">+</button>

    <!-- Multi-Mode Engine HUD Toolbar (hidable options panel) -->
    <div id="demo-toolbar" role="region" aria-label="Engine options" hidden>
        <button id="btn-hide-panel" type="button" title="Hide engine options"
            aria-label="Hide engine options">&times;</button>
        <div class="toolbar-group">
            <label for="mode-select" style="font-weight: 600;">Engine Mode:</label>
            <select id="mode-select">
                <option value="classic">Standard Roll (Flick & Settle)</option>
                <option value="continuous">Continuous Live Gyro (Tilt & Shake)</option>
                <option value="predetermined">Predetermined Roll (Target Values)</option>
            </select>
        </div>

        <div id="motion-controls" class="toolbar-group" style="display: none;">
            <button id="btn-motion" type="button">Enable Motion</button>
            <span id="motion-status" style="font-size: 12px; opacity: 0.85;">Motion sensors off</span>
        </div>

        <div id="predetermined-controls" class="toolbar-group" style="display: none;">
            <label for="predetermined-inputs">Target:</label>
            <input type="text" id="predetermined-inputs" value="6, 6, 6" placeholder="e.g. 6,6,6" style="width: 80px;" />
            <button id="btn-predetermined-roll" type="button">Roll Target</button>
        </div>

        <div class="toolbar-group">
            <label for="enclosure-select" style="font-weight: 600;">Enclosure:</label>
            <select id="enclosure-select">
                <option value="box">Box (Classic Tray)</option>
                <option value="sphere">Sphere (Orbe)</option>
                <option value="cylinder">Cylinder (Dice Cup)</option>
            </select>
        </div>

        <div class="toolbar-group">
            <label for="camera-distance" style="font-weight: 600;">Camera:</label>
            <input type="range" id="camera-distance" min="0.4" max="3" step="0.05" value="1"
                title="Distance from scene (zoom)" style="width: 110px;" />
            <span id="camera-distance-value" style="font-size: 12px; opacity: 0.9; min-width: 36px;">1.00&times;</span>
            <label for="camera-near" style="font-size: 12px;">Near:</label>
            <input type="number" id="camera-near" min="0.1" step="1" placeholder="1"
                title="Near clipping plane (default 1)" style="width: 56px;" />
            <label for="camera-far" style="font-size: 12px;">Far:</label>
            <input type="number" id="camera-far" min="0" step="100" placeholder="auto"
                title="Far clipping plane (0/empty = auto: distance + 1500)" style="width: 68px;" />
            <button id="camera-reset" type="button" title="Reset camera to defaults"
                style="padding: 6px 10px; font-size: 12px;">Reset</button>
        </div>

        <div class="toolbar-group">
            <button id="btn-roll" type="button">Throw</button>
            <button id="btn-clear" type="button">Clear</button>
        </div>
    </div>

    <div id="selector_div" style="display: none;">
        <div class="center_field"></div>
        <pre id="set" style="display: none;"></pre><br />
    </div>

    <div id="canvas"></div>
    <div id="settings" style="position: fixed; left:80vw; top:1vh;"></div>
    <pre id="middleDiv" style="position: fixed; top: 30vh; left: 40vw; font-size: xx-large; display: none;"></pre>

</body>

</html>
