<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Predetermined roll showcase: predict natural results and shift face mappings to requested values." />
    <title>Predetermined Roll — Dice Playground</title>
  </head>
  <body>
    <div id="app">
      <header class="pred-header">
        <h1>Predetermined Roll</h1>
        <p class="pred-caption">
          Predict natural results, then shift face mappings so the visible roll lands on your targets. Drag on the stage to throw.
        </p>
      </header>
      <main class="pred-main">
        <section
          id="stage"
          class="pred-stage"
          data-testid="stage"
          aria-label="3D dice stage. Drag or flick to throw the dice."
        ></section>
        <aside class="pred-panel">
          <section
            id="controls-host"
            class="pred-controls"
            aria-label="Predetermined roll controls"
          ></section>
          <section
            id="targets-host"
            class="pred-targets"
            data-testid="targets-panel"
            aria-label="Per-die target values"
          ></section>
          <section
            id="explanation-panel"
            class="pred-info"
            data-testid="explanation-panel"
            aria-label="Prediction explanation"
          ></section>
          <p class="pred-home">
            <a href="../../../" data-testid="home-link">&larr; All apps</a>
          </p>
        </aside>
      </main>
      <p id="pred-error" class="pred-error" data-testid="fatal-error" hidden></p>
      <div id="banner-host"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
