<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Dice visual lab: chamfer, radius, colors, materials, and face mapping previews." />
    <title>Dice Visual Lab — Dice Playground</title>
  </head>
  <body>
    <div id="app">
      <header class="visual-header">
        <h1>Dice Visual Lab</h1>
        <p class="visual-caption">
          Explore pure dice data and rendering: chamfer, radius, colors, materials, and face mappings. Drag on the stage to throw.
        </p>
      </header>
      <main class="visual-main">
        <section
          id="stage"
          class="visual-stage"
          data-testid="stage"
          aria-label="3D dice stage. Drag or flick to throw the dice."
        ></section>
        <aside class="visual-panel">
          <section
            id="controls-host"
            class="visual-controls"
            aria-label="Dice visual lab controls"
          ></section>
          <section
            id="preview-panel"
            class="visual-info"
            data-testid="preview-panel"
            aria-label="Pure dice data preview"
          ></section>
          <p class="visual-home">
            <a href="../../../" data-testid="home-link">&larr; All apps</a>
          </p>
        </aside>
      </main>
      <p id="visual-error" class="visual-error" data-testid="fatal-error" hidden></p>
      <div id="banner-host"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
